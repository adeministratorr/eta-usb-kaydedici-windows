name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify WebEngine (EBA girisi icin sart)
        run: |
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print('WebEngine OK')"

      - name: Syntax check
        run: |
          python -c "import ast,glob; [ast.parse(open(f,encoding='utf-8').read()) for f in glob.glob('src/*.py')]; print('syntax OK')"

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name "ETA-USB-Kaydedici" `
            --version-file version_info.txt `
            --icon assets/logo.ico `
            --add-data "assets;assets" `
            --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore `
            --hidden-import PySide6.QtWebChannel --hidden-import PySide6.QtNetwork `
            --hidden-import PySide6.QtPrintSupport `
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DRender --exclude-module PySide6.Qt3DInput `
            --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.Qt3DAnimation `
            --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.QtBluetooth `
            --exclude-module PySide6.QtNfc --exclude-module PySide6.QtPositioning `
            --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSerialPort `
            --exclude-module PySide6.QtSerialBus --exclude-module PySide6.QtWebSockets `
            --exclude-module PySide6.QtHelp --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtTest `
            --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtScxml `
            --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtLocation `
            src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETA-USB-Kaydedici-win64
          path: dist/ETA-USB-Kaydedici.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETA-USB-Kaydedici.exe
          generate_release_notes: true
